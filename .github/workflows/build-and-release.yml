name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-local-inference.txt
          pip install pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.7 pytest
          pip check
          python -c "from importlib.metadata import distributions; installed={d.metadata['Name'].lower().replace('_','-') for d in distributions()}; assert 'onnxruntime' in installed; assert not installed.intersection({'onnxruntime-directml', 'onnxruntime-gpu'}), installed"

      - name: Test model downloads
        run: python -m pytest tests/test_model_download.py tests/test_native_local_inference.py -q

      - name: Prepare bundled resources
        run: |
          python -c "from local_inference.model_manager import apply_cache_env, download_silero, ensure_vendor_sources; apply_cache_env(); download_silero(); ensure_vendor_sources('qwen3-asr')"

      - name: Build Yakutan
        run: pyinstaller --clean --noconfirm run_ui.spec

      - name: Verify EXE
        run: python scripts/check_frozen_package.py dist/Yakutan.exe --report build/package-audit/Yakutan.json

      - name: Upload package audit
        uses: actions/upload-artifact@v4
        with:
          name: package-audit
          path: build/package-audit/Yakutan.json

      - name: Prepare release
        id: release
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $date = git log -1 --date=format:%Y%m%d-%H%M%S --pretty=%cd
          $message = git log -1 --pretty=%s
          $exe = "Yakutan-$date.exe"
          Rename-Item -LiteralPath dist/Yakutan.exe -NewName $exe
          "tag=v$date-$sha" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "date=$date" >> $env:GITHUB_OUTPUT
          "message=$message" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Yakutan ${{ steps.release.outputs.tag }}
          body: |
            ## 自动构建版本

            **提交信息**: ${{ steps.release.outputs.message }}
            **提交日期**: ${{ steps.release.outputs.date }}
            **提交 SHA**: `${{ steps.release.outputs.sha }}`

            **构建产物**:
            - `Yakutan-*.exe`：单文件程序；本地识别已内置，模型可在程序内下载。
          files: dist/${{ steps.release.outputs.exe }}
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
